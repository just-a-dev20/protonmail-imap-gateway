name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false
      - run: python -m pip install ruff==0.16.9
      - run: ruff check . && ruff format --check .
      - run: test -z "$(gofmt -l upstream/*.go upstream/web/*.go)"
      - run: python -m unittest discover -v
      - run: sh scripts/test-keychain.sh
      - run: sh scripts/init-secrets.sh && test "$(stat -c %a config.toml)" = 644 && docker compose config --quiet
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: gateway-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Protocol tests inside hardened container
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m gateway-test:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          load: true
          tags: gateway:ci
          cache-from: type=gha
      - name: Engine startup and account-free Compose smoke test
        run: sh scripts/smoke-compose.sh
      - name: Scan complete image (OS and Go dependencies)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gateway:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: test
          load: true
          tags: gateway-web-test:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Wrapper tests in web image
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m gateway-web-test:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: final
          load: true
          tags: gateway-web:ci
          cache-from: type=gha,scope=web
      - name: Real web-backend TLS and Compose smoke test
        run: sh scripts/smoke-web-compose.sh
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gateway-web:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
